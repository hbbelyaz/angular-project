<section class="task-panel" aria-labelledby="task-title">
  <h1 id="task-title">{{ title }}</h1>

  <div class="task-actions">
    <button class="rename-button" type="button" (click)="rename()">Renommer</button>
    <button
      class="delete-button"
      type="button"
      [disabled]="!canDelete"
      (click)="delete()"
    >
      Supprimer
    </button>
  </div>

  @if (tasks.length === 0) {
    <p class="empty">Aucune tâche pour l'instant</p>
  } @else {
    <ul>
      @for (task of tasks; track task.id) {
        <li>
          <span class="task-name">{{ $index + 1 }}. {{ task.title | uppercase }}</span>
          <span class="due-date">Échéance : {{ task.dueDate | date:'dd/MM/yyyy' }}</span>
        </li>
      }
    </ul>
  }

  <button
    class="clear-button"
    type="button"
    [disabled]="tasks.length === 0"
    (click)="clearTasks()"
  >
    Vider la liste
  </button>
</section>
